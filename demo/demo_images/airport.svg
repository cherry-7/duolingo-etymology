<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 250" role="img" aria-label="An airplane takes off from the airport" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .fly{animation:fly 1.8s infinite}
    .pitch{transform-box:fill-box;transform-origin:15% 100%;animation:pitch 1.8s infinite ease-in-out}
    .gear{animation:gear 1.8s infinite steps(1)}
    .dust{opacity:0;animation:dust 1.8s infinite ease-out;transform-box:fill-box;transform-origin:center}
    .d2{animation-delay:.08s}.d3{animation-delay:.16s}
    .speed{opacity:0;animation:speed 1.8s infinite}
    @keyframes fly{
      0%{transform:translate(296px,183px) scale(.8);opacity:0;animation-timing-function:ease-in}
      8%{opacity:1}
      42%{transform:translate(352px,183px) scale(.8);animation-timing-function:linear}
      62%{transform:translate(400px,156px) scale(.8);animation-timing-function:ease-in}
      100%{transform:translate(540px,30px) scale(.8);opacity:1}}
    @keyframes pitch{0%,36%{transform:rotate(0)}56%,100%{transform:rotate(-16deg)}}
    @keyframes gear{0%{opacity:1}62%{opacity:0}}
    @keyframes dust{0%,38%{opacity:0;transform:translate(0,0) scale(.4)}44%{opacity:1}70%{opacity:0;transform:translate(-22px,-4px) scale(1.2)}100%{opacity:0}}
    @keyframes speed{0%,14%{opacity:0}22%,44%{opacity:1}54%,100%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.fly,.pitch,.gear,.dust,.speed{animation:none}.fly{transform:translate(320px,183px) scale(.8)}}
  </style>

  <!-- cloud -->
  <g fill="#D4EDFB"><circle cx="388" cy="62" r="13"/><circle cx="404" cy="54" r="16"/><circle cx="420" cy="64" r="11"/><rect x="376" y="62" width="56" height="13" rx="6.5"/></g>

  <!-- ground -->
  <rect x="8" y="222" width="464" height="18" rx="9" fill="#48C204"/>

  <!-- bushes -->
  <g fill="#48C204"><rect x="10" y="212" width="44" height="14"/><circle cx="22" cy="214" r="12"/><circle cx="36" cy="206" r="15"/><circle cx="48" cy="214" r="11"/></g>

  <!-- terminal -->
  <rect x="80" y="138" width="196" height="88" rx="8" fill="#FCD103"/>
  <rect x="72" y="128" width="212" height="14" rx="7" fill="#48C204"/>
  <g fill="#D4EDFB">
    <rect x="160" y="158" width="36" height="28" rx="5"/>
    <rect x="216" y="158" width="40" height="28" rx="5"/>
    <path d="M110 226V180Q110 164 126 164Q142 164 142 180V226Z"/>
  </g>

  <!-- sign -->
  <g fill="#3F3C3C"><rect x="146" y="112" width="5" height="18" rx="2"/><rect x="209" y="112" width="5" height="18" rx="2"/></g>
  <rect x="118" y="88" width="124" height="30" rx="10" fill="#48C204"/>
  <text x="180" y="110" text-anchor="middle" font-family="Fredoka, 'Duolingo Sans', system-ui, sans-serif" font-weight="600" font-size="19" letter-spacing="1" fill="#D4EDFB">AIRPORT</text>

  <!-- control tower -->
  <rect x="48" y="96" width="34" height="130" rx="6" fill="#FCD103"/>
  <rect x="64" y="34" width="4" height="22" rx="2" fill="#3F3C3C"/>
  <rect x="40" y="50" width="52" height="10" rx="5" fill="#3F3C3C"/>
  <rect x="34" y="58" width="64" height="40" rx="8" fill="#48C204"/>
  <rect x="42" y="66" width="48" height="20" rx="5" fill="#D4EDFB"/>


  <!-- dust where the wheels leave the ground -->
  <g fill="#D4EDFB">
    <g class="dust"><circle cx="392" cy="216" r="6"/><circle cx="384" cy="219" r="5"/><circle cx="400" cy="219" r="5"/></g>
    <g class="dust d2"><circle cx="378" cy="215" r="7"/><circle cx="370" cy="219" r="5"/><circle cx="386" cy="219" r="5"/></g>
    <g class="dust d3"><circle cx="364" cy="217" r="5"/><circle cx="357" cy="220" r="4"/><circle cx="371" cy="220" r="4"/></g>
  </g>

  <!-- airplane (drawn facing right, rear wheel at its origin area) -->
  <g class="fly">
    <g class="pitch">
      <g class="speed" stroke="#D4EDFB" stroke-width="4" stroke-linecap="round"><line x1="-30" y1="26" x2="-10" y2="26"/><line x1="-38" y1="36" x2="-16" y2="36"/></g>
      <g class="gear" fill="#3F3C3C">
        <rect x="27" y="38" width="4" height="8" rx="2"/><circle cx="29" cy="46" r="5"/>
        <rect x="83" y="38" width="4" height="8" rx="2"/><circle cx="85" cy="46" r="5"/>
      </g>
      <path fill="#FCD103" d="M4 24L-2 4Q-3 0 2 0H12Q16 0 18 4L30 24Z"/>
      <rect x="0" y="18" width="110" height="24" rx="12" fill="#48C204"/>
      <path fill="#D4EDFB" d="M94 22H101Q107 23 109 30H94Q91 30 91 26Q91 22 94 22Z"/>
      <g fill="#D4EDFB"><circle cx="30" cy="27" r="3"/><circle cx="40" cy="27" r="3"/><circle cx="50" cy="27" r="3"/><circle cx="60" cy="27" r="3"/><circle cx="70" cy="27" r="3"/><circle cx="80" cy="27" r="3"/></g>
      <path fill="#FCD103" d="M42 33H72Q76 33 73 37L60 52Q58 55 54 55H48Q44 55 45 51Z"/>
    </g>
  </g>
</svg>
