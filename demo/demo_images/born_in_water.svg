<svg width="360" height="210" viewBox="0 0 360 210" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="born in water: a fish swims right to left under the words, blowing bubbles">
<style>
  .word{font-family:Fredoka,"Nunito","Arial Rounded MT Bold",system-ui,sans-serif;font-weight:600;font-size:36px;fill:#3C3C3C}
  .swim{animation:swim 2.0s linear infinite}
  .bob{animation:bob 1s ease-in-out infinite}
  .tail{transform-box:view-box;transform-origin:28px 0px;animation:tail .5s ease-in-out infinite}
  .fin{transform-box:view-box;transform-origin:4px 15px;animation:fin .5s ease-in-out infinite}
  .wave{animation:wave 2s linear infinite}
  .bub{animation-duration:2.0s;animation-timing-function:linear;animation-iteration-count:infinite;opacity:0}
  @keyframes bob{0%,100%{transform:translateY(-3px) rotate(-2deg)}50%{transform:translateY(3px) rotate(2deg)}}
  @keyframes tail{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
  @keyframes fin{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(18deg)}}
  @keyframes wave{to{transform:translateX(-40px)}}
    @keyframes swim{0%{transform:translate(410.0px,140.0px)}100%{transform:translate(-70.0px,140.0px)}}
  @keyframes b00{0%,11.90%{transform:translate(313.4px,141.0px) scale(.2);opacity:0}12.00%{transform:translate(313.4px,141.0px) scale(.3);opacity:1}14.00%{transform:translate(296.8px,132.0px) scale(.75);opacity:1}34.00%{transform:translate(301.8px,108.0px) scale(1);opacity:1}54.00%{transform:translate(294.8px,86.0px) scale(1.1);opacity:0}54.10%,100%{transform:translate(313.4px,141.0px) scale(.2);opacity:0}}
  @keyframes b01{0%,13.90%{transform:translate(303.8px,147.0px) scale(.2);opacity:0}14.00%{transform:translate(303.8px,147.0px) scale(.3);opacity:1}16.00%{transform:translate(287.2px,138.0px) scale(.75);opacity:1}36.00%{transform:translate(292.2px,114.0px) scale(1);opacity:1}56.00%{transform:translate(285.2px,92.0px) scale(1.1);opacity:0}56.10%,100%{transform:translate(303.8px,147.0px) scale(.2);opacity:0}}
  @keyframes b10{0%,26.90%{transform:translate(241.4px,141.0px) scale(.2);opacity:0}27.00%{transform:translate(241.4px,141.0px) scale(.3);opacity:1}29.00%{transform:translate(224.8px,132.0px) scale(.75);opacity:1}49.00%{transform:translate(229.8px,108.0px) scale(1);opacity:1}69.00%{transform:translate(222.8px,86.0px) scale(1.1);opacity:0}69.10%,100%{transform:translate(241.4px,141.0px) scale(.2);opacity:0}}
  @keyframes b11{0%,28.90%{transform:translate(231.8px,147.0px) scale(.2);opacity:0}29.00%{transform:translate(231.8px,147.0px) scale(.3);opacity:1}31.00%{transform:translate(215.2px,138.0px) scale(.75);opacity:1}51.00%{transform:translate(220.2px,114.0px) scale(1);opacity:1}71.00%{transform:translate(213.2px,92.0px) scale(1.1);opacity:0}71.10%,100%{transform:translate(231.8px,147.0px) scale(.2);opacity:0}}
  @keyframes b20{0%,41.90%{transform:translate(169.4px,141.0px) scale(.2);opacity:0}42.00%{transform:translate(169.4px,141.0px) scale(.3);opacity:1}44.00%{transform:translate(152.8px,132.0px) scale(.75);opacity:1}64.00%{transform:translate(157.8px,108.0px) scale(1);opacity:1}84.00%{transform:translate(150.8px,86.0px) scale(1.1);opacity:0}84.10%,100%{transform:translate(169.4px,141.0px) scale(.2);opacity:0}}
  @keyframes b21{0%,43.90%{transform:translate(159.8px,147.0px) scale(.2);opacity:0}44.00%{transform:translate(159.8px,147.0px) scale(.3);opacity:1}46.00%{transform:translate(143.2px,138.0px) scale(.75);opacity:1}66.00%{transform:translate(148.2px,114.0px) scale(1);opacity:1}86.00%{transform:translate(141.2px,92.0px) scale(1.1);opacity:0}86.10%,100%{transform:translate(159.8px,147.0px) scale(.2);opacity:0}}
  @keyframes b30{0%,54.90%{transform:translate(107.0px,141.0px) scale(.2);opacity:0}55.00%{transform:translate(107.0px,141.0px) scale(.3);opacity:1}57.00%{transform:translate(90.4px,132.0px) scale(.75);opacity:1}77.00%{transform:translate(95.4px,108.0px) scale(1);opacity:1}97.00%{transform:translate(88.4px,86.0px) scale(1.1);opacity:0}97.10%,100%{transform:translate(107.0px,141.0px) scale(.2);opacity:0}}
  @keyframes b31{0%,56.90%{transform:translate(97.4px,147.0px) scale(.2);opacity:0}57.00%{transform:translate(97.4px,147.0px) scale(.3);opacity:1}59.00%{transform:translate(80.8px,138.0px) scale(.75);opacity:1}79.00%{transform:translate(85.8px,114.0px) scale(1);opacity:1}99.00%{transform:translate(78.8px,92.0px) scale(1.1);opacity:0}99.10%,100%{transform:translate(97.4px,147.0px) scale(.2);opacity:0}}
  @media (prefers-reduced-motion:reduce){.swim,.bob,.tail,.fin,.wave,.bub{animation:none}.swim{transform:translate(180px,140.0px)}}
</style>
<text class="word" x="180" y="50" text-anchor="middle">born in water</text>
