<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 130" role="img" aria-label="A truck drives in and away, puffing exhaust" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .truck{animation:drive 1.8s infinite}
    .bob{animation:bob .3s ease-in-out infinite;transform-box:fill-box}
    .puff{opacity:0;animation-duration:1.8s;animation-iteration-count:infinite;animation-timing-function:ease-out}
    @keyframes drive{
      0%{transform:translate(-200px,20px) scale(0.6);animation-timing-function:cubic-bezier(.2,.7,.3,1)}
      35%{transform:translate(114.8px,20px) scale(0.6)}
      48%{transform:translate(114.8px,20px) scale(0.6);animation-timing-function:cubic-bezier(.55,0,1,.6)}
      100%{transform:translate(420px,20px) scale(0.6)}}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
        @keyframes p0{0%,36.0%{opacity:0;transform:translate(149.6px,80.0px) scale(.4)}39.0%{opacity:1}66.0%{opacity:0;transform:translate(123.6px,74.0px) scale(1.1)}100%{opacity:0}}
    @keyframes p1{0%,48.0%{opacity:0;transform:translate(149.6px,80.0px) scale(.4)}51.0%{opacity:1}78.0%{opacity:0;transform:translate(123.6px,74.0px) scale(1.1)}100%{opacity:0}}
    @keyframes p2{0%,54.2%{opacity:0;transform:translate(154.0px,80.0px) scale(.4)}57.2%{opacity:1}84.2%{opacity:0;transform:translate(128.0px,74.0px) scale(1.1)}100%{opacity:0}}
    @keyframes p3{0%,61.0%{opacity:0;transform:translate(168.7px,80.0px) scale(.4)}64.0%{opacity:1}91.0%{opacity:0;transform:translate(142.7px,74.0px) scale(1.1)}100%{opacity:0}}
    @keyframes p4{0%,67.8%{opacity:0;transform:translate(193.7px,80.0px) scale(.4)}70.8%{opacity:1}97.8%{opacity:0;transform:translate(167.7px,74.0px) scale(1.1)}100%{opacity:0}}
    @keyframes p5{0%,74.0%{opacity:0;transform:translate(225.9px,80.0px) scale(.4)}77.0%{opacity:1}100.0%{opacity:0;transform:translate(199.9px,74.0px) scale(1.1)}100%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.truck,.bob,.puff{animation:none}.truck{transform:translate(114.8px,20px) scale(0.6)}}
  </style>
  <g fill="#D4EDFB">
        <g class="puff" style="animation-name:p0"><g transform="scale(1.5)"><circle r="6"/><circle cx="-6" cy="3" r="5"/><circle cx="6" cy="3" r="5"/><circle cy="6" r="5"/></g></g>
    <g class="puff" style="animation-name:p1"><g transform="scale(1.8)"><circle r="6"/><circle cx="-6" cy="3" r="5"/><circle cx="6" cy="3" r="5"/><circle cy="6" r="5"/></g></g>
    <g class="puff" style="animation-name:p2"><g transform="scale(1.5)"><circle r="6"/><circle cx="-6" cy="3" r="5"/><circle cx="6" cy="3" r="5"/><circle cy="6" r="5"/></g></g>
    <g class="puff" style="animation-name:p3"><g transform="scale(1.8)"><circle r="6"/><circle cx="-6" cy="3" r="5"/><circle cx="6" cy="3" r="5"/><circle cy="6" r="5"/></g></g>
    <g class="puff" style="animation-name:p4"><g transform="scale(1.5)"><circle r="6"/><circle cx="-6" cy="3" r="5"/><circle cx="6" cy="3" r="5"/><circle cy="6" r="5"/></g></g>
    <g class="puff" style="animation-name:p5"><g transform="scale(1.8)"><circle r="6"/><circle cx="-6" cy="3" r="5"/><circle cx="6" cy="3" r="5"/><circle cy="6" r="5"/></g></g>
  </g>
  <g class="truck">
  <g class="bob">
    <!-- cab -->
    <path fill="#48C204" d="M176 28H230Q243 28 249 40L257 57Q272 65 272 84V101Q272 110 263 110H72Q65 110 65 103Q65 96 72 96H176Z"/>
    <!-- cargo box -->
    <rect x="70" y="12" width="118" height="88" rx="10" fill="#FCD103"/>
    <!-- window + headlight -->
    <path fill="#D4EDFB" d="M200 38H232Q240 38 244 46L250 62Q252 72 242 72H200Q195 72 195 67V43Q195 38 200 38Z"/>
    <circle cx="266" cy="88" r="7" fill="#D4EDFB"/>
  </g>

  <!-- wheels -->
  <g>
    <circle cx="115" cy="109" r="23" fill="#3F3C3C"/><circle cx="115" cy="109" r="10" fill="#D4EDFB"/>
    <circle cx="225" cy="109" r="23" fill="#3F3C3C"/><circle cx="225" cy="109" r="10" fill="#D4EDFB"/>
  </g>
  </g>
</svg>
